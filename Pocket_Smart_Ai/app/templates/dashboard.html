{% extends "base.html" %}

{% block content %}

<h1>
    Dashboard
</h1>

<p id="welcome"></p>


<div class="grid">

    <a
        class="card"
        href="/planner/home"
    >

        <h2>
            Home Planner
        </h2>

        <p>
            Interior budget planning
        </p>

    </a>


    <a
        class="card"
        href="/planner/party"
    >

        <h2>
            Party Planner
        </h2>

        <p>
            Event budget planning
        </p>

    </a>


    <a
        class="card"
        href="/planner/jewelry"
    >

        <h2>
            Jewelry Planner
        </h2>

        <p>
            Occasion and outfit matching
        </p>

    </a>

</div>


<h2>
    Recommendation History
</h2>

<div id="history"></div>


<form
    method="post"
    action="/logout"
>

    <button
        class="btn secondary"
        type="submit"
    >
        Logout
    </button>

</form>

{% endblock %}
