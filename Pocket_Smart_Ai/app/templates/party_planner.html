{% extends "base.html" %}

{% block content %}

<div class="card">

    <h1>
        Party Budget Planner
    </h1>


    <form id="plannerForm">

        <label>

            Budget (₹)

            <input
                name="budget"
                type="number"
                min="1"
                required
            >

        </label>


        <label>

            Guests

            <input
                name="guests"
                type="number"
                min="1"
                required
            >

        </label>


        <label>

            Event Type

            <input
                name="event_type"
                placeholder="Birthday"
                required
            >

        </label>


        <label>

            Venue

            <input
                name="venue"
                placeholder="Home / Hall / Outdoor"
            >

        </label>


        <label>

            Preferences

            <textarea
                name="preferences"
            ></textarea>

        </label>


        <button
            class="btn"
            type="submit"
        >
            Generate Recommendations
        </button>

    </form>


    <div id="result"></div>

</div>


<script>

document
    .getElementById("plannerForm")
    .addEventListener(
        "submit",
        event => sendPlanner(
            event,
            "/generate-party",
            "party"
        )
    );

</script>

{% endblock %}
