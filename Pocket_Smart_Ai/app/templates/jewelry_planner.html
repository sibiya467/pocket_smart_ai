{% extends "base.html" %}

{% block content %}

<div class="card">

    <h1>
        Jewelry Budget Planner
    </h1>


    <form id="plannerForm">

        <label>

            Budget (₹)

            <input
                name="budget"
                type="number"
                min="1"
                required
            >

        </label>


        <label>

            Occasion

            <input
                name="occasion"
                placeholder="Wedding / Birthday"
                required
            >

        </label>


        <label>

            Style

            <input
                name="style"
                placeholder="Minimal / Traditional"
                required
            >

        </label>


        <label>

            Outfit Description

            <textarea
                name="outfit_description"
            ></textarea>

        </label>


        <label>

            Preferences

            <textarea
                name="preferences"
            ></textarea>

        </label>


        <label>

            Outfit Image (Optional)

            <input
                name="outfit_image"
                type="file"
                accept="image/*"
            >

        </label>


        <button
            class="btn"
            type="submit"
        >
            Generate Recommendations
        </button>

    </form>


    <div id="result"></div>

</div>


<script>

document
    .getElementById("plannerForm")
    .addEventListener(
        "submit",
        event => sendJewelry(event)
    );

</script>

{% endblock %}
