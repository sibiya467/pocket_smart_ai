{% extends "base.html" %}

{% block content %}

<div class="card narrow">

    <h1>
        Create Account
    </h1>


    <form
        onsubmit="return submitRegister(event)"
    >

        <label>

            Name

            <input
                id="name"
                required
            >

        </label>


        <label>

            Email

            <input
                id="email"
                type="email"
                required
            >

        </label>


        <label>

            Password

            <input
                id="password"
                type="password"
                minlength="6"
                required
            >

        </label>


        <button
            class="btn"
            type="submit"
        >
            Register
        </button>

    </form>


    <p>

        Already registered?

        <a href="/login">
            Login
        </a>

    </p>

</div>

{% endblock %}
